name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run dist

      - name: Ensure dist is committed
        run: git diff --exit-code dist || (echo "::error::dist/ is outdated, run 'yarn dist' and commit the result" && exit 1)

      # Tests run against the freshly bundled dist/, so dependency updates are covered too.
      - name: Test
        run: npm test
