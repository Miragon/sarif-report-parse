name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run dist

      - name: Ensure dist is committed
        run: git diff --exit-code dist || (echo "::error::dist/ is outdated, run 'yarn dist' and commit the result" && exit 1)

      # Tests run against the freshly bundled dist/, so dependency updates are covered too.
      - name: Test
        run: npm test
